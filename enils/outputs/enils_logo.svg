<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="tealEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 76px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .brand-accent {
      fill: url(#cyanBlue);
    }
    .brand-subtitle {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 4.5px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .brand-tag {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
  </style>

  <!-- Dark Canvas Background -->
  <rect width="900" height="320" rx="24" fill="url(#bgGrad)" />
  <rect width="898" height="318" x="1" y="1" rx="23" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Background Tech Grid / Circuit Elements -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.2">
    <line x1="80" y1="40" x2="260" y2="40" />
    <line x1="260" y1="40" x2="300" y2="80" />
    <line x1="80" y1="280" x2="240" y2="280" />
    <line x1="240" y1="280" x2="280" y2="240" />
    <circle cx="260" cy="40" r="3" fill="#38bdf8" />
    <circle cx="280" cy="240" r="3" fill="#38bdf8" />
  </g>

  <!-- ==================== EMBLEM (X: 170, Y: 160) ==================== -->
  <g transform="translate(170, 160)">
    
    <!-- Outer Glow Ambient -->
    <circle cx="0" cy="0" r="85" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />

    <!-- Edge Computing Outer Diamond Bracket -->
    <path d="M 0 -96 L 96 0 L 0 96 L -96 0 Z" 
          fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Corner Circuit Node Pins -->
    <circle cx="0" cy="-96" r="3.5" fill="#38bdf8" />
    <circle cx="96" cy="0" r="3.5" fill="#38bdf8" />
    <circle cx="0" cy="96" r="3.5" fill="#38bdf8" />
    <circle cx="-96" cy="0" r="3.5" fill="#38bdf8" />

    <!-- ================= VOICE SOUNDWAVE ARCS (Outer) ================= -->
    <!-- Left Voice Ripples -->
    <path d="M -58 -55 A 80 80 0 0 0 -58 55" fill="none" stroke="url(#cyanBlue)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M -75 -40 A 100 100 0 0 0 -75 40" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.45" />

    <!-- Right Voice Ripples -->
    <path d="M 58 -55 A 80 80 0 0 1 58 55" fill="none" stroke="url(#cyanBlue)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 75 -40 A 100 100 0 0 1 75 40" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.45" />

    <!-- ================= OPEN BOOK / WINGS OF LEARNING ================= -->
    <!-- Left Page -->
    <path d="M -6 48 C -32 40 -60 48 -70 20 C -70 -15 -42 -26 -6 -20 Z" 
          fill="url(#cyanBlue)" opacity="0.9" />
    <path d="M -6 48 C -26 42 -50 48 -58 26 C -58 0 -34 -8 -6 -4 Z" 
          fill="#1e1b4b" opacity="0.4" />

    <!-- Right Page -->
    <path d="M 6 48 C 32 40 60 48 70 20 C 70 -15 42 -26 6 -20 Z" 
          fill="url(#tealEmerald)" opacity="0.9" />
    <path d="M 6 48 C 26 42 50 48 58 26 C 58 0 34 -8 6 -4 Z" 
          fill="#1e1b4b" opacity="0.4" />

    <!-- Spine of Book / Central Ridge -->
    <path d="M 0 54 L 0 -18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- ================= EDGE CHIP CORE & INTELLIGENCE SPARK ================= -->
    <!-- Edge Microchip Hexagon/Square Center -->
    <rect x="-16" y="-56" width="32" height="32" rx="7" fill="#0f172a" stroke="url(#cyanBlue)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Chip Micro-pins -->
    <line x1="-16" y1="-46" x2="-22" y2="-46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="-34" x2="-22" y2="-34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="-46" x2="22" y2="-46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="-34" x2="22" y2="-34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-6" y1="-56" x2="-6" y2="-62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="-56" x2="6" y2="-62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Golden Spark of Intelligence (Center of Chip) -->
    <circle cx="0" cy="-40" r="6" fill="url(#goldAccent)" filter="url(#glow)" />
    <polygon points="0,-49 3,-42 10,-40 3,-38 0,-31 -3,-38 -10,-40 -3,-42" fill="#ffffff" />
    
    <!-- Pulse Ring around Spark -->
    <circle cx="0" cy="-40" r="11" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6" stroke-dasharray="3 3" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDMARK ==================== -->
  <g transform="translate(325, 125)">
    <!-- Category Badge -->
    <rect x="2" y="-18" width="180" height="26" rx="13" fill="#0369a1" opacity="0.25" />
    <rect x="2" y="-18" width="180" height="26" rx="13" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.5" />
    <circle cx="16" cy="-5" r="4" fill="#10b981" />
    <text x="28" y="-1" class="brand-tag">OFFLINE AI TUTOR</text>

    <!-- Main Title: ENILS -->
    <text x="0" y="70" class="brand-title">
      E<tspan class="brand-accent">N</tspan>ILS
    </text>

    <!-- Golden Dot accent on the 'I' -->
    <circle cx="178" cy="20" r="7.5" fill="url(#goldAccent)" filter="url(#glow)" />

    <!-- Tagline: Subtitle -->
    <text x="3" y="110" class="brand-subtitle">
      Edge-Native Interactive Learning System
    </text>

    <!-- Highlights Line / Metadata -->
    <g transform="translate(3, 134)" opacity="0.75">
      <circle cx="4" cy="4" r="3" fill="#06b6d4" />
      <text x="14" y="8" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        100% CPU Offline
      </text>

      <circle cx="130" cy="4" r="3" fill="#06b6d4" />
      <text x="140" y="8" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        Voice STT/TTS
      </text>

      <circle cx="236" cy="4" r="3" fill="#06b6d4" />
      <text x="246" y="8" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        Textbook RAG
      </text>

      <circle cx="348" cy="4" r="3" fill="#06b6d4" />
      <text x="358" y="8" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        Local LLM
      </text>
    </g>
  </g>
</svg>
